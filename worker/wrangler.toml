name = "wpcna-posting-review"
account_id = "7f9044dada49a97b6c1949e521915a84"
main = "src/posting-worker.js"
compatibility_date = "2026-04-21"

# Secrets (set with `wrangler secret put`):
#   ANTHROPIC_API_KEY        <- powers AI vetting
#   RESEND_API_KEY           <- email delivery
#   POSTING_RECIPIENT_EMAILS <- primary To recipient(s), comma-separated
#   POSTING_BCC_EMAILS       <- BCC recipient(s), comma-separated (optional)
#   GITHUB_TOKEN             <- fine-grained token, Contents:write on GITHUB_REPO (one-click publish)
#   APPROVE_SIGNING_SECRET   <- random string; signs the Approve & Publish links

[vars]
ALLOWED_ORIGINS = "https://wp-cna.org,https://www.wp-cna.org,https://wp-cna.github.io"
POSTING_RECIPIENT_EMAILS_DEFAULT = "wpcna.info@gmail.com,michael@mdalton.com,michael.kushman@gmail.com"
GITHUB_REPO = "wp-cna/demo14"
GITHUB_BRANCH = "main"
POSTINGS_PATH = "src/_data/communityPostings.json"
SITE_BASE_URL = "https://wp-cna.org"
# Vetting model (default in code is claude-sonnet-4-6).
# POSTING_REVIEW_MODEL = "claude-sonnet-4-6"
